# Servicios de desarrollo local de ByteBalance.
# Las variables se leen automáticamente desde el archivo .env de la raíz.
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: bytebalance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definida en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definida en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bytebalance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
